services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: auth-service
      APP_PORT: 3000
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: auth_service
      DATABASE_PASSWORD: auth_service_password
      DATABASE_NAME: auth_service
      JWT_SECRET: local-secret
      TOKEN_EXPIRATION: 1000d
      REFRESH_TOKEN_EXPIRATION_DAYS: 30
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      AUTH_SUCCESS_REDIRECT_URL: ${AUTH_SUCCESS_REDIRECT_URL:-http://localhost:3000/auth/success}
      AUTH_FAILURE_REDIRECT_URL: ${AUTH_FAILURE_REDIRECT_URL:-http://localhost:3000/auth/failure}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service_password
      POSTGRES_DB: auth_service
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth_service -d auth_service']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
