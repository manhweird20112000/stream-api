services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      APP_NAME: api-gateway
      APP_PORT: 3000
      API_GATEWAY_INSTANCES: 1
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: api-gateway
      KAFKA_GROUP_ID: api-gateway
      JWT_SECRET: local-secret
      TOKEN_EXPIRATION: 1000d
      REFRESH_TOKEN_EXPIRATION_DAYS: 30
      AUTH_SUCCESS_REDIRECT_URL: http://localhost:3000/api/v1/auth/success
      AUTH_FAILURE_REDIRECT_URL: http://localhost:3000/api/v1/auth/failure
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stream-net

networks:
  stream-net:
    external: true
