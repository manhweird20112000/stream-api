services:
  stream-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: stream-service
      APP_PORT: 3000
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: stream_service
      DATABASE_PASSWORD: stream_service_password
      DATABASE_NAME: stream_service
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: stream-service
      KAFKA_GROUP_ID: stream-service
      JWT_SECRET: local-secret
      TOKEN_EXPIRATION: 1000d
    ports:
      - '13002:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - stream-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stream_service
      POSTGRES_PASSWORD: stream_service_password
      POSTGRES_DB: stream_service
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stream_service -d stream_service']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  stream-net:
    external: true
