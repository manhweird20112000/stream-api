services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api_env
      APP_NAME: LOCAL
      APP_PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ddd_nest_api
      DB_SYNC: 'false'
      JWT_SECRET: local-secret
      TOKEN_EXPIRATION: 1000d
      MIKRO_ORM_CLI_PREFER_TS: 'false'
    command: pnpm migration:up

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment: *api_env
    ports:
      - '3000:3000'
    volumes:
      - ./storages:/app/storages
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ddd_nest_api
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ddd_nest_api']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
